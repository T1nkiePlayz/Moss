name: Moss CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle-size budget (initial JavaScript, per-route chunks reported)
        run: node ../scripts/bundle-budget.mjs
      - name: Install the browser for UI checks
        run: npx playwright install --with-deps chromium
      - name: UI checks (every page renders cleanly and passes axe)
        run: npm run test:ui
      - name: CurseForge edge function test
        working-directory: .
        run: node supabase/functions/curseforge/index.test.mts

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR caches are only reused by the same PR; main's cache serves every PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The binary embeds web/dist; an empty directory is enough to compile and test the backend.
      - name: Prepare embedded UI directory
        run: mkdir -p web/dist
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  # macOS compiles src/platform/macos.rs, which Linux CI never sees. Same checks, same caching approach.
  backend-macos:
    name: Backend (macOS)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-09)
        with:
          components: clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare embedded UI directory
        run: mkdir -p web/dist
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
