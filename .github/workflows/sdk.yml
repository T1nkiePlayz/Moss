name: SDKs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/openapi.frozen.json"
      - "sdk/**"
      - "scripts/gen-sdk.sh"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "docs/openapi.frozen.json"
      - "sdk/**"
      - "scripts/gen-sdk.sh"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: Generate, build and test SDKs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Regenerate both SDKs
        run: scripts/gen-sdk.sh
      - name: Fail on drift from the committed SDKs
        run: git diff --exit-code sdk/
      - name: TypeScript build
        working-directory: sdk/typescript
        run: npm run build
      - name: TypeScript test
        working-directory: sdk/typescript
        run: npm test
      - name: Python test
        working-directory: sdk/python
        run: |
          python -m venv "$RUNNER_TEMP/pytest-venv"
          "$RUNNER_TEMP/pytest-venv/bin/pip" install -e '.[test]'
          "$RUNNER_TEMP/pytest-venv/bin/pytest"
