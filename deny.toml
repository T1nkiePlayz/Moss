# cargo-deny configuration (checked weekly and on lockfile changes by
# .github/workflows/audit.yml). Moss is GPL-3.0-only, so permissive licences
# and weak copyleft that allows GPL-3.0 combination are accepted; anything
# else fails the build and needs a deliberate decision here.

[graph]
all-features = true

[advisories]
# Advisories are also checked by cargo-audit; deny repeats them so one tool
# can gate a local run.
yanked = "deny"
ignore = [
    # See .cargo/audit.toml for the reasoning behind both entries.
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0449",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# Moss itself. cargo-deny cannot express the "-only" suffix in an allow list.
exceptions = [{ crate = "moss", allow = ["GPL-3.0-only"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
