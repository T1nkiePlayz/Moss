[package]
name = "moss-desktop"
version = "0.2.0"
edition = "2024"
description = "Moss desktop: a native window and tray icon around the Moss controller"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
moss-desktop-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
