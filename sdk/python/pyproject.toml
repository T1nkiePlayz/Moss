[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moss-client"
version = "0.1.0"
description = "Python client for the Moss game server controller API, models generated from docs/openapi.frozen.json"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/moss_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
